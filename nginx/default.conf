
map $http_cookie $cookie_token {
    "~token=([^;]+)" $1;
}

server {
    listen 80;

    location / {
        alias /usr/share/nginx/html/;
        access_log off;
    }

    location /secret_layer {
        auth_request /verify;
        alias /usr/share/nginx/html/secret_layer/;
        auth_request_set $auth_status $upstream_status;
        auth_request_set $auth_status $upstream_status;
        index index.html;
    }

    location /prove {
        proxy_pass http://cave:1337/prove;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    location = /verify {
        internal;
        proxy_pass http://cave:1337/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer $cookie_token";
        add_header X-Debug-Auth "$cookie_token";
    }
}

